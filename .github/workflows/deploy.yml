name: Deploy

# Каждый коммит в main: проверки → сборка образов в GHCR → деплой по SSH.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_checks:
        description: Пропустить проверки (только для срочного деплоя)
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  checks:
    name: Проверки
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_checks }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Biome
        run: bun run lint
      - name: Типы web
        run: bun run typecheck

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: go vet
        run: go vet ./...
        working-directory: apps/api
      - name: go test
        run: go test ./...
        working-directory: apps/api

  build:
    name: Образ ${{ matrix.image }}
    needs: checks
    if: ${{ always() && (needs.checks.result == 'success' || inputs.skip_checks) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: web
            context: .
            dockerfile: apps/web/Dockerfile
          - image: api
            context: apps/api
            dockerfile: apps/api/Dockerfile
          - image: backup
            context: deploy/backup
            dockerfile: deploy/backup/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL || 'https://m3105.ru' }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  deploy:
    name: Деплой
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: ${{ vars.SITE_URL || 'https://m3105.ru' }}
    steps:
      - uses: actions/checkout@v4

      - name: Ключ и known_hosts
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Логин в GHCR на сервере
        run: |
          printf '%s' '${{ secrets.GITHUB_TOKEN }}' |
            ssh -o BatchMode=yes "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      # Скрипт берётся из этого коммита, а не с сервера: так он не меняется под собой во время git reset.
      - name: Обновить стек
        run: |
          ssh -o BatchMode=yes "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "IMAGE_TAG='${{ github.sha }}' bash -s" < deploy/deploy.sh

      - name: Выйти из GHCR на сервере
        if: always()
        run: |
          ssh -o BatchMode=yes "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "docker logout ghcr.io" || true

      - name: Проверка сайта
        run: |
          site='${{ vars.SITE_URL || 'https://m3105.ru' }}'
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "$site/api/v1/healthz"
          echo
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors -o /dev/null -w 'главная: %{http_code}\n' "$site/"
