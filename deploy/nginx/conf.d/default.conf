# Splits traffic between the Go API and the Next.js app.
# Traefik (external, on the virtual-hosts network) terminates TLS and forwards here.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $forwarded_proto {
    ''      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 20M;

    set_real_ip_from 172.16.0.0/12;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    proxy_redirect off;
    proxy_buffering off;

    proxy_connect_timeout 5s;
    proxy_read_timeout    120s;
    proxy_send_timeout    120s;

    # Go API keeps its /api/v1 prefix.
    location ~ ^/api/(.*) {
        set $upstream_api "api";
        proxy_pass http://$upstream_api:8080/api/$1$is_args$args;
    }

    location / {
        set $upstream_web "web";
        proxy_pass http://$upstream_web:3000;
    }
}
