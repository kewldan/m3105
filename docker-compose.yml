# Production stack. TLS is terminated by the server-wide Traefik that lives on
# the external `virtual-hosts` network (cert resolver `myresolver`), the same
# way ControlPanel is deployed. nginx splits /api/* → Go, the rest → Next.js.

services:
  proxy:
    image: nginx:alpine
    restart: unless-stopped
    expose:
      - 80
    networks:
      - backends
      - virtual-hosts
    depends_on:
      - web
      - api
    labels:
      - traefik.enable=true
      - traefik.http.routers.edu3105.rule=Host(`${DOMAIN:-m3105.ru}`)
      - traefik.http.routers.edu3105.tls=true
      - traefik.http.routers.edu3105.tls.certresolver=myresolver
      - traefik.http.services.edu3105.loadbalancer.server.port=80
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro

  web:
    # Образ собирается в GitHub Actions; build остаётся для локальной сборки (--build).
    image: ghcr.io/kewldan/m3105/web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN:-m3105.ru}
    restart: unless-stopped
    environment:
      API_URL: http://api:8080
      NEXT_PUBLIC_SITE_URL: https://${DOMAIN:-m3105.ru}
      # Общий секрет: по нему api сбрасывает кеш публичного контента.
      REVALIDATE_TOKEN: ${REVALIDATE_TOKEN:-}
      TZ: ${TZ:-Europe/Moscow}
    expose:
      - 3000
    depends_on:
      - api
    networks:
      - backends

  api:
    image: ghcr.io/kewldan/m3105/api:${IMAGE_TAG:-latest}
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      APP_ENV: production
      ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-edu}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-edu}?sslmode=disable
      VALKEY_ADDR: valkey:6379
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      PUBLIC_URL: https://${DOMAIN:-m3105.ru}
      COOKIE_SECURE: "true"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      BOT_DIGEST_HOUR: ${BOT_DIGEST_HOUR:-10}
      WEB_URL: http://web:3000
      REVALIDATE_TOKEN: ${REVALIDATE_TOKEN:-}
      # Вложения: бакет в MinIO создаётся при первом старте.
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:-edu3105}
      # Превью картинок; если imgproxy недоступен, api отдаёт оригиналы.
      IMGPROXY_URL: http://imgproxy:8080
      IMGPROXY_KEY: ${IMGPROXY_KEY:?set IMGPROXY_KEY in .env}
      IMGPROXY_SALT: ${IMGPROXY_SALT:?set IMGPROXY_SALT in .env}
      TZ: ${TZ:-Europe/Moscow}
    expose:
      - 8080
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - backends

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edu}
      POSTGRES_USER: ${POSTGRES_USER:-edu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edu} -d ${POSTGRES_DB:-edu}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backends

  valkey:
    image: valkey/valkey:9-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "60", "1", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backends

  # Вложения (S3). Только во внутренней сети: файлы отдаёт api с проверкой прав,
  # наружу хранилище не смотрит. MinIO больше не выпускает сборки community-версии,
  # поэтому образ закреплён на последнем релизе; api говорит с ним по обычному S3 API
  # и переедет на другое S3-совместимое хранилище сменой S3_ENDPOINT.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      MINIO_BROWSER: "off"
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backends

  # Превью картинок: уменьшает по ширине и пережимает в WebP (libvips). Читает
  # оригиналы прямо из бакета MinIO и живёт только во внутренней сети: к нему
  # ходит api, уже проверив права, а URL подписаны ключом из .env.
  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:v4.0.15
    restart: unless-stopped
    environment:
      IMGPROXY_KEY: ${IMGPROXY_KEY:?set IMGPROXY_KEY in .env}
      IMGPROXY_SALT: ${IMGPROXY_SALT:?set IMGPROXY_SALT in .env}
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: http://minio:9000
      IMGPROXY_S3_REGION: us-east-1
      IMGPROXY_S3_ALLOWED_BUCKETS: ${S3_BUCKET:-edu3105}
      IMGPROXY_ALLOWED_SOURCES: s3://
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      # Загрузка ограничена 60 мегапикселями, больше imgproxy и не увидит.
      IMGPROXY_MAX_SRC_RESOLUTION: "60"
      # Сервер небольшой: две картинки одновременно, память возвращается системе.
      IMGPROXY_WORKERS: "2"
      IMGPROXY_MALLOC: jemalloc
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backends

  # Ежедневный бэкап: pg_dump + конфиги одним архивом в Telegram админу (deploy/backup),
  # файлы из MinIO — вторым архивом, если с прошлого раза что-то поменялось.
  backup:
    image: ghcr.io/kewldan/m3105/backup:${IMAGE_TAG:-latest}
    build: ./deploy/backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-edu}
      PGUSER: ${POSTGRES_USER:-edu}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      BACKUP_CHAT_ID: ${BACKUP_CHAT_ID:-}
      BACKUP_HOUR: ${BACKUP_HOUR:-4}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      DOMAIN: ${DOMAIN:-m3105.ru}
      BACKUP_FILES_DIR: /files
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - ./.env:/project/.env:ro
      - ./docker-compose.yml:/project/docker-compose.yml:ro
      - ./deploy:/project/deploy:ro
      - backup-data:/backups
      - minio-data:/files:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backends

networks:
  backends:
  virtual-hosts:
    external: true

volumes:
  postgres-data:
  valkey-data:
  backup-data:
  minio-data:
